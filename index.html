<!DOCTYPE html>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #334155; line-height: 1.5; }
        
        /* 상단 헤더 */
        header { background: #0f172a; color: white; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #0284c7; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #38bdf8; text-decoration: none; letter-spacing: -0.5px; cursor: pointer; }
        .logo span { color: #ffffff; font-weight: 400; font-size: 1.1rem; margin-left: 6px; }

        /* 상단 네비게이션 바 (GNB) */
        .gnb-nav { background: #1e293b; border-bottom: 1px solid #334155; width: 100%; }
        .gnb-container { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; list-style: none; }
        .gnb-item { position: relative; }
        .gnb-link { display: block; padding: 14px 24px; color: #f8fafc; font-weight: 700; text-decoration: none; font-size: 1rem; transition: background 0.2s, color 0.2s; cursor: pointer; }
        .gnb-item:hover .gnb-link { background: #0284c7; color: #ffffff; }

        /* 중분류 드롭다운 서브메뉴 */
        .sub-menu { display: none; position: absolute; top: 100%; left: 0; background: #ffffff; min-width: 170px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); border-radius: 0 0 8px 8px; border: 1px solid #e2e8f0; border-top: none; list-style: none; z-index: 100; }
        .sub-menu li a { display: block; padding: 11px 18px; color: #334155; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: background 0.2s, color 0.2s; cursor: pointer; }
        .sub-menu li a:hover { background: #e0f2fe; color: #0284c7; font-weight: bold; }
        .gnb-item:hover .sub-menu { display: block; }
        
        /* 페이지 뷰 제어 */
        .page-view { display: none; }
        .page-view.active { display: block; }

        /* 메인 컨테이너 */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; clear: both; }
        
        /* 네이버 검색창 섹션 */
        .search-section { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; text-align: center; border: 1px solid #e2e8f0; }
        .search-box { display: flex; max-width: 600px; margin: 0 auto; gap: 8px; }
        .search-box input { flex: 1; padding: 12px 16px; border: 2px solid #03cf5d; border-radius: 8px; font-size: 1rem; outline: none; }
        .search-box input:focus { border-color: #0284c7; }
        .search-box button { padding: 12px 24px; background: #03cf5d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .search-box button:hover { background: #02b350; }

        /* 2열 레이아웃 */
        .main-layout { display: flex; gap: 25px; flex-wrap: wrap; }
        .content-area { flex: 3; min-width: 300px; }
        .sidebar { flex: 1; min-width: 260px; }

        /* 카테고리 섹션 */
        .category-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .category-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .link-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .link-btn { display: block; width: 100%; padding: 10px 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; text-decoration: none; color: #334155; font-size: 0.88rem; font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-family: inherit; }
        .link-btn:hover { background: #e0f2fe; color: #0369a1; border-color: #7dd3fc; }

        /* 사이드바 배너 및 매장 음악 위젯 */
        .banner-box { background: linear-gradient(135deg, #0f172a, #1e293b); color: white; padding: 22px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
        .banner-box h3 { color: #38bdf8; margin-bottom: 8px; font-size: 1.25rem; font-weight: bold; }
        .banner-box p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 16px; line-height: 1.4; }
        .banner-btn { display: inline-block; padding: 11px 20px; background: #0284c7; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
        .banner-btn:hover { background: #0369a1; }

        /* 음악 위젯 그리드 */
        .music-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .music-btn { background: #f1f5f9; padding: 10px; border-radius: 8px; text-decoration: none; color: #334155; font-size: 0.82rem; text-align: center; border: 1px solid #e2e8f0; font-weight: 600; display: block; }
        .music-btn:hover { background: #ff0000; color: white; border-color: #ff0000; }
        .music-btn span { display: block; font-size: 0.72rem; color: #64748b; font-weight: normal; margin-bottom: 2px; }
        .music-btn:hover span { color: #ffe4e4; }

        /* ===== [회사소개 / 오시는길 / 조직도 스타일] ===== */
        .about-hero { background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1556742049-0a670f4a458d?auto=format&fit=crop&w=1200&q=80') center/cover; color: white; padding: 60px 30px; border-radius: 16px; text-align: center; margin-bottom: 35px; }
        .about-hero h1 { font-size: 2.2rem; font-weight: 800; color: #38bdf8; margin-bottom: 12px; }
        .about-hero p { font-size: 1.1rem; color: #e2e8f0; max-width: 700px; margin: 0 auto; line-height: 1.6; }
        
        .about-section { background: #ffffff; padding: 35px; border-radius: 14px; border: 1px solid #e2e8f0; margin-bottom: 30px; }
        .about-section h2 { font-size: 1.4rem; color: #0f172a; margin-bottom: 18px; border-left: 4px solid #0284c7; padding-left: 12px; }
        .about-text { font-size: 1rem; color: #475569; line-height: 1.8; margin-bottom: 25px; }

        .value-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .value-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 22px; text-align: center; }
        .value-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .value-title { font-weight: bold; font-size: 1.1rem; color: #0f172a; margin-bottom: 8px; }
        .value-desc { font-size: 0.9rem; color: #64748b; line-height: 1.5; }

        /* 조직도 카드 스타일 */
        .org-tree { display: flex; flex-direction: column; align-items: center; gap: 25px; margin-top: 20px; }
        .org-level-1 { width: 100%; max-width: 320px; }
        .org-line { width: 2px; height: 25px; background: #cbd5e1; }
        .org-level-2 { width: 100%; background: #0f172a; color: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 450px; }
        .org-level-2 .name { font-size: 1.2rem; font-weight: bold; color: #38bdf8; margin-bottom: 4px; }
        .org-level-2 .title { font-size: 0.95rem; color: #cbd5e1; }
        
        .org-team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; width: 100%; margin-top: 10px; }
        .org-member-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 18px; text-align: center; transition: transform 0.2s; }
        .org-member-card:hover { transform: translateY(-3px); border-color: #0284c7; }
        .org-member-card .pos { display: inline-block; background: #0284c7; color: white; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 6px; }
        .org-member-card .name { font-size: 1.05rem; font-weight: bold; color: #0f172a; margin-bottom: 4px; }
        .org-member-card .dept { font-size: 0.85rem; color: #64748b; }

        /* 모달 팝업 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #fff; width: 100%; max-width: 520px; max-height: 90vh; border-radius: 14px; overflow-y: auto; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-title { font-size: 1.25rem; font-weight: bold; color: #0f172a; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: #64748b; cursor: pointer; padding: 4px; }
        .modal-info { background: #f8fafc; padding: 12px 14px; border-radius: 8px; font-size: 0.85rem; color: #475569; margin-bottom: 18px; line-height: 1.4; border: 1px solid #f1f5f9; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
        .card-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; }
        .card-name { font-weight: bold; font-size: 0.95rem; color: #0f172a; margin-bottom: 6px; }
        .card-link { display: inline-block; color: #0284c7; text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-bottom: 8px; }
        .card-link:hover { text-decoration: underline; }
        .card-tel { font-size: 0.82rem; color: #64748b; }
        .modal-footer-note { font-size: 0.78rem; color: #64748b; line-height: 1.4; margin-bottom: 15px; }
        .modal-footer-link { font-size: 0.82rem; color: #475569; margin-bottom: 20px; }
        .modal-footer-link a { color: #0284c7; text-decoration: none; font-weight: bold; }
        .modal-btn-close { display: block; width: 100%; padding: 12px; background: #e2e8f0; color: #334155; border: none; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; text-align: center; }
        .modal-btn-close:hover { background: #cbd5e1; }

        /* 하단 푸터 */
        footer { background: #f1f5f9; text-align: center; padding: 30px 20px; color: #64748b; font-size: 0.85rem; border-top: 1px solid #e2e8f0; margin-top: 40px; line-height: 1.8; }
        footer strong { color: #334155; }
    </style>
</head>
