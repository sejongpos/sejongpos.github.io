    <title>주식회사 세종테크 - 매장 포털 & POS/키오스크</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #334155; line-height: 1.5; }
        
        /* 상단 헤더 */
        header { background: #0f172a; color: white; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #0284c7; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #38bdf8; text-decoration: none; letter-spacing: -0.5px; }
        .logo span { color: #ffffff; font-weight: 400; font-size: 1.1rem; margin-left: 6px; }

        /* 회사 홈페이지 네비게이션 바 (GNB) */
        .gnb-nav { background: #1e293b; border-bottom: 1px solid #334155; }
        .gnb-container { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; list-style: none; position: relative; }
        .gnb-item { position: relative; }
        .gnb-link { display: block; padding: 14px 24px; color: #f8fafc; font-weight: 700; text-decoration: none; font-size: 1rem; transition: background 0.2s, color 0.2s; }
        .gnb-item:hover .gnb-link { background: #0284c7; color: #ffffff; }

        /* 중분류 드롭다운 메뉴 */
        .sub-menu { display: none; position: absolute; top: 100%; left: 0; background: #ffffff; min-width: 170px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); border-radius: 0 0 8px 8px; border: 1px solid #e2e8f0; border-top: none; list-style: none; z-index: 500; }
        .sub-menu li a { display: block; padding: 11px 18px; color: #334155; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: background 0.2s, color 0.2s; }
        .sub-menu li a:hover { background: #e0f2fe; color: #0284c7; font-weight: bold; }
        .gnb-item:hover .sub-menu { display: block; }
        
        /* 메인 컨테이너 */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        /* 네이버 검색창 섹션 */
        .search-section { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; text-align: center; border: 1px solid #e2e8f0; }

        .search-box input:focus { border-color: #0284c7; }
        .search-box button { padding: 12px 24px; background: #03cf5d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .search-box button:hover { background: #02b350; }

        /* 자주 찾는 사이트 (아이콘 그리드) */
        .quick-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .quick-item { background: #fff; padding: 15px 10px; border-radius: 10px; text-align: center; text-decoration: none; color: #1e293b; font-weight: 600; font-size: 0.9rem; border: 1px solid #e2e8f0; transition: all 0.2s; display: block; }
        .quick-item:hover { transform: translateY(-3px); border-color: #0284c7; color: #0284c7; }
        .quick-icon { font-size: 1.5rem; display: block; margin-bottom: 5px; }

        /* 2열 레이아웃 */
        .main-layout { display: flex; gap: 25px; flex-wrap: wrap; }
        .content-area { flex: 3; min-width: 300px; }
        .sidebar { flex: 1; min-width: 260px; }

        /* 카테고리 섹션 */
        .category-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .category-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .link-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .link-btn { display: block; width: 100%; padding: 10px 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; text-decoration: none; color: #334155; font-size: 0.88rem; font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-family: inherit; }
        .link-btn:hover { background: #e0f2fe; color: #0369a1; border-color: #7dd3fc; }

        /* 사이드바 배너 및 매장 음악 위젯 */
        .banner-box { background: linear-gradient(135deg, #0f172a, #1e293b); color: white; padding: 22px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
        .banner-box h3 { color: #38bdf8; margin-bottom: 8px; font-size: 1.25rem; font-weight: bold; }
        .banner-box p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 16px; line-height: 1.4; }
        .banner-btn { display: inline-block; padding: 11px 20px; background: #0284c7; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
        .banner-btn:hover { background: #0369a1; }

        /* 음악 위젯 그리드 */
        .music-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .music-btn { background: #f1f5f9; padding: 10px; border-radius: 8px; text-decoration: none; color: #334155; font-size: 0.82rem; text-align: center; border: 1px solid #e2e8f0; font-weight: 600; display: block; }
        .music-btn:hover { background: #ff0000; color: white; border-color: #ff0000; }
        .music-btn span { display: block; font-size: 0.72rem; color: #64748b; font-weight: normal; margin-bottom: 2px; }
        .music-btn:hover span { color: #ffe4e4; }

        .modal-close { background: none; border: none; font-size: 1.5rem; color: #64748b; cursor: pointer; padding: 4px; }
        .modal-info { background: #f8fafc; padding: 12px 14px; border-radius: 8px; font-size: 0.85rem; color: #475569; margin-bottom: 18px; line-height: 1.4; border: 1px solid #f1f5f9; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
        .card-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; }
        .card-name { font-weight: bold; font-size: 0.95rem; color: #0f172a; margin-bottom: 6px; }
        .card-link { display: inline-block; color: #0284c7; text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-bottom: 8px; }
        .card-link:hover { text-decoration: underline; }
